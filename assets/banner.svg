<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">xiegaoxiao — Build things that work</title>
  <desc id="desc">Independent developer profile in cobalt blue, coral orange and lemon yellow.</desc>
  <rect x="3" y="3" width="954" height="324" rx="22" fill="#F9F4E8" stroke="#171717" stroke-width="6"/>
  <path d="M648 6h287a19 19 0 0 1 19 19v279a19 19 0 0 1-19 19H648Z" fill="#FF725E"/>
