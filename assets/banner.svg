  <text x="36" y="292" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#171717">CODE / CREATE / SHARE</text>
  <circle cx="585" cy="286" r="9" fill="#FF725E" stroke="#171717" stroke-width="2"/>
  <g transform="rotate(-10 802 148)">
    <rect x="717" y="60" width="170" height="170" rx="16" fill="#171717"/>
    <rect x="709" y="52" width="170" height="170" rx="16" fill="#F4E54D" stroke="#171717" stroke-width="5"/>
    <path d="M752 176l83-83m-68 0h68v68" fill="none" stroke="#171717" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <text x="802" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#171717">LESS NOISE.</text>
  <text x="802" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#171717">MORE MAKING.</text>
