  <text x="32" y="131" font-family="Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="-4" fill="#2346ED">xiegaoxiao.</text>
  <text x="36" y="181" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#171717">Build things that work.</text>
  <text x="36" y="219" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#171717">把想法做成工具，把工具做得好用。</text>
