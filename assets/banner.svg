<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0221"/>
      <stop offset="1" stop-color="#1A0533"/>
    </linearGradient>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowMagenta" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- 赛博网格 -->
  <g stroke="#00FFF5" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>

  <!-- 角标 -->
  <text x="20" y="26" font-family="monospace" font-size="11" fill="#FF2E97" letter-spacing="2">// CYBERPUNK EDITION — WUHAN NODE</text>
  <text x="880" y="26" text-anchor="end" font-family="monospace" font-size="11" fill="#B388FF" letter-spacing="2">SIGNAL: ▓▓▓▓▓▓▓▓▓░</text>

  <!-- 主标题 -->
  <text x="450" y="104" text-anchor="middle" font-family="'Courier New',monospace" font-size="58" font-weight="bold" fill="#00FFF5" filter="url(#glowCyan)" letter-spacing="10">XIE&#160;GAOXIAO</text>

  <!-- 副标题 -->
  <text x="450" y="146" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" fill="#FF2E97" filter="url(#glowMagenta)" letter-spacing="8">渣渣辉 // PAPALALADIN</text>

  <!-- 日文点缀 -->
  <text x="450" y="178" text-anchor="middle" font-family="monospace" font-size="12" fill="#B388FF" letter-spacing="8">電脳の世界へようこそ — NIGHT CITY</text>

  <!-- 扫描线（静态高亮线） -->
  <line x1="0" y1="60" x2="900" y2="60" stroke="#00FFF5" stroke-opacity="0.25" stroke-width="1"/>
</svg>
